<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef4ff);
            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e3a8a;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card .label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
            display: block;
        }

        .card .value {
            font-size: 34px;
            font-weight: bold;
            color: #111827;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            min-width: 220px;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        select, button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 18px;
            color: #374151;
            line-height: 1.6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .chart-box {
            width: 100%;
            height: 300px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IPL Dashboard</h1>

        <div class="cards">
            <div class="card">
                <span class="label">Total Matches</span>
                <div class="value" id="totalMatches">0</div>
            </div>
            <div class="card">
                <span class="label">Total Teams</span>
                <div class="value" id="totalTeams">0</div>
            </div>
            <div class="card">
                <span class="label">Total Cities</span>
                <div class="value" id="totalCities">0</div>
            </div>
        </div>

        <div class="panel">
            <h2>Team Matches</h2>
            <div class="row">
                <div class="field">
                    <label for="teamSelect">Choose Team</label>
                    <select id="teamSelect"></select>
                </div>
                <button id="teamBtn">View Matches</button>
            </div>
            <div id="teamResult" class="result">Select a team to view its matches.</div>
        </div>

        <div class="panel">
            <h2>City Matches</h2>
            <div class="row">
                <div class="field">
                    <label for="citySelect">Choose City</label>
                    <select id="citySelect"></select>
                </div>
                <button id="cityBtn">View Matches</button>
            </div>
            <div id="cityResult" class="result">Select a city to view matches.</div>
        </div>

        <div class="panel">
            <h2>Head-to-Head Comparison</h2>
            <div class="row">
                <div class="field">
                    <label for="team1Select">Team 1</label>
                    <select id="team1Select"></select>
                </div>
                <div class="field">
                    <label for="team2Select">Team 2</label>
                    <select id="team2Select"></select>
                </div>
                <button id="headToHeadBtn">Compare</button>
            </div>
            <div id="headToHeadResult" class="result">Select two teams to compare.</div>
        </div>

        <div class="panel">
            <h2>Matches by City</h2>
            <div class="chart-box">
                <canvas id="cityChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>Recent Matches</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>City</th>
                        <th>Team 1</th>
                        <th>Team 2</th>
                    </tr>
                </thead>
                <tbody id="matchTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const teamSelect = document.getElementById('teamSelect');
        const citySelect = document.getElementById('citySelect');
        const team1Select = document.getElementById('team1Select');
        const team2Select = document.getElementById('team2Select');

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to fetch: ' + url);
            return res.json();
        }

        function populateSelect(selectEl, items, label) {
            selectEl.innerHTML = '<option value="">' + label + '</option>';
            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                selectEl.appendChild(option);
            });
        }

        function renderTable(matches) {
            const tbody = document.getElementById('matchTableBody');
            tbody.innerHTML = '';
            matches.slice(0, 10).forEach(match => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${match.id ?? '--'}</td>
                    <td>${match.date ?? '--'}</td>
                    <td>${match.city ?? '--'}</td>
                    <td>${match.team1 ?? '--'}</td>
                    <td>${match.team2 ?? '--'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderCityChart(matches) {
            const counts = {};
            matches.forEach(match => {
                const city = match.city || 'Unknown';
                counts[city] = (counts[city] || 0) + 1;
            });

            const labels = Object.keys(counts);
            const values = Object.values(counts);

            const ctx = document.getElementById('cityChart');
            if (window.cityChart) {
                window.cityChart.destroy();
            }

            window.cityChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Matches by city',
                        data: values,
                        backgroundColor: '#4F46E5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }

        async function loadDashboard() {
            const [teamsData, citiesData, matchesData] = await Promise.all([
                fetchJSON('/api/teams'),
                fetchJSON('/api/cities'),
                fetchJSON('/api/matches')
            ]);

            const teams = teamsData.teams || [];
            const cities = citiesData.cities || [];
            const matches = matchesData.matches || [];

            document.getElementById('totalMatches').textContent = matches.length;
            document.getElementById('totalTeams').textContent = teams.length;
            document.getElementById('totalCities').textContent = cities.length;

            populateSelect(teamSelect, teams, 'Choose team');
            populateSelect(citySelect, cities, 'Choose city');
            populateSelect(team1Select, teams, 'Choose team 1');
            populateSelect(team2Select, teams, 'Choose team 2');

            renderTable(matches);
            renderCityChart(matches);
        }

        document.getElementById('teamBtn').addEventListener('click', async () => {
            const team = teamSelect.value;
            if (!team) {
                document.getElementById('teamResult').textContent = 'Please select a team.';
                return;
            }

            const data = await fetchJSON('/api/team/' + encodeURIComponent(team));
            const matches = data.matches || [];
            document.getElementById('teamResult').innerHTML = `
                <strong>${team}</strong> has <strong>${data.count}</strong> matches.<br>
                ${matches.slice(0, 5).map(m => `${m.date} - ${m.team1} vs ${m.team2} (${m.city})`).join('<br>') || 'No matches found.'}
            `;
        });

        document.getElementById('cityBtn').addEventListener('click', async () => {
            const city = citySelect.value;
            if (!city) {
                document.getElementById('cityResult').textContent = 'Please select a city.';
                return;
            }

            const data = await fetchJSON('/api/city/' + encodeURIComponent(city));
            const matches = data.matches || [];
            document.getElementById('cityResult').innerHTML = `
                <strong>${city}</strong> has <strong>${data.count}</strong> matches.<br>
                ${matches.slice(0, 5).map(m => `${m.date} - ${m.team1} vs ${m.team2}`).join('<br>') || 'No matches found.'}
            `;
        });

        document.getElementById('headToHeadBtn').addEventListener('click', async () => {
            const team1 = team1Select.value;
            const team2 = team2Select.value;

            if (!team1 || !team2) {
                document.getElementById('headToHeadResult').textContent = 'Please select both teams.';
                return;
            }

            if (team1 === team2) {
                document.getElementById('headToHeadResult').textContent = 'Please select different teams.';
                return;
            }

            const data = await fetchJSON('/api/teamVteam/' + encodeURIComponent(team1) + '/' + encodeURIComponent(team2));
            const matches = data.matches || [];
            document.getElementById('headToHeadResult').innerHTML = `
                <strong>${team1}</strong> vs <strong>${team2}</strong> -> <strong>${data.count}</strong> matches.<br>
                ${matches.slice(0, 5).map(m => `${m.date} - ${m.team1} vs ${m.team2} (${m.city})`).join('<br>') || 'No head-to-head records found.'}
            `;
        });

        loadDashboard();
    </script>
</body>
</html>
